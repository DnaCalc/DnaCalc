[package]
name = "calc-platform-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The native-only package for the desktop platform adapter: native filesystem and operating-system services for the desktop application."

[package.metadata.dnacalc]
portability = "native-only"

# The macro security level the two desktop applications store (macro_security.rs, dc-15dk).
[dependencies]
calc-macro-security = { path = "../../crates/calc-macro-security" }

# The physical core count (GetLogicalProcessorInformation) for the default number of recalculation
# threads. windows-sys is already in the workspace lock.
#
# The desktop shell (Windows only): the window chain, the WebView2 host, WinHTTP, file dialogs.
# Versions match the ones the desktop applications used before the shell moved here.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
