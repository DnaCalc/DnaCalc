[package]
name = "com-descriptor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Reads a COM type library (registered or from a file, never registering anything) and writes a JSON descriptor of selected interfaces: IIDs, DISPIDs, vtable slots and exact parameter lists."

[package.metadata.dnacalc]
portability = "native-only"

# serde derives keep the descriptor's keys in declaration order; serde_json writes it.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

# Type library loading and reading (Ole, Com, Variant), and the source file's version resource
# (Storage_FileSystem). windows 0.61.3 is already in the workspace lock through calc-platform-desktop.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
