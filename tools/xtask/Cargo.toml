[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Product-independent command and checks for the DNA Calc workspace."

[package.metadata.dnacalc]
portability = "native-only"

[dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde_json = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }

# Only the existing acceptance suite imports the product. cargo xtask never builds dev dependencies.
[dev-dependencies]
calc-func = { path = "../../crates/calc-func" }
calc-verdict = { path = "../calc-verdict" }

[features]
acceptance = []

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["acceptance"]
