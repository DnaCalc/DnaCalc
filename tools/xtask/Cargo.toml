[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The package for the DNA Calc workspace's repository tooling (cargo xtask)."

[package.metadata.dnacalc]
portability = "native-only"

# serde_json reads manifests, cargo metadata and the tracker and writes receipts; syn, quote and
# proc-macro2 parse Rust sources for the architecture checks (module trees, test-only items, pub
# enum variants and traits, and the token scans), with span-locations for line numbers.
[dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde_json = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
