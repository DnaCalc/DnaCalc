[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for the DNA Calc workspace's repository tooling (cargo xtask)."

[package.metadata.dnacalc]
portability = "native-only"

# serde_json reads manifests, cargo metadata and the tracker and writes receipts; syn, quote and
# proc-macro2 parse Rust sources for the architecture checks (module trees, test-only items, pub
# enum variants and traits, and the token scans), with span-locations for line numbers;
# calc-verdict is the one verdict path `cargo xtask verdict` runs.
# calc-host is the route `cargo xtask compare` opens, recalculates and projects a workbook through
# (HostState::open, step, project); calc-engine, calc-fml and calc-func supply the types its read
# observer is shown (ObservedEvaluation, ExecutedCall) and the typed refusals its triage reads
# (NotModeled's CompileError, EvalFault and FunctionFault, and the catalogue that spells a
# FunctionId).
[dependencies]
calc-engine = { path = "../../crates/calc-engine" }
calc-fml = { path = "../../crates/calc-fml" }
calc-func = { path = "../../crates/calc-func" }
calc-host = { path = "../../crates/calc-host" }
calc-verdict = { path = "../calc-verdict" }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde_json = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }

# calc-oracle-excel is the one Excel capture adapter `cargo xtask capture` runs. It is native-only
# and refuses wasm32 itself, so it is left out of a wasm32 build of xtask (and so is the capture
# command, in main.rs), which must fail through xtask's own compile_error! alone.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calc-oracle-excel = { path = "../../platform/calc-oracle-excel" }

# `cargo xtask bench` reads its own process's peak memory (GetProcessMemoryInfo) and its thread
# cycles (QueryThreadCycleTime). windows-sys is already in the workspace lock (calc-oracle-excel's
# isolation uses it).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
