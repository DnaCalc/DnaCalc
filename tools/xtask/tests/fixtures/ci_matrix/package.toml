# Copied as tools/ci-matrix-fixture/Cargo.toml into a copy of the workspace by the infra-m0.2 cases,
# which also add the package to that copy's workspace members. It never enters the real workspace.
[package]
name = "xtask-ci-matrix-fixture"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The portable fixture package of the infra-m0.2 cases, present only in a copy of the workspace."

[package.metadata.dnacalc]
portability = "portable"

# wasm-bindgen-test-runner 0.2.117 runs only test binaries built with wasm-bindgen 0.2.117 exactly,
# and wasm-bindgen-test 0.3.67 is the release built on that wasm-bindgen. Test-only, and only for
# wasm32: the native build of tests/matrix.rs holds a plain #[test].
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
