[workspace]
resolver = "3"
# Every member declares `[package.metadata.dnacalc] portability` as "portable" or "native-only".
# The wasm32 check excludes exactly the native-only members, and each of those refuses to compile
# for wasm32.
members = [
    "crates/calc-value",
    "crates/calc-func",
    "crates/calc-fml",
    "crates/calc-doc-model",
    "crates/calc-doc",
    "crates/calc-engine",
    "crates/calc-host",
    "apps/dna-onecalc",
    "apps/dna-calc",
    "platform/calc-platform-desktop",
    "platform/calc-oracle-excel",
    "tools/calc-verdict",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

# The browser bundles of DNA OneCalc and DNA Calc (`cargo xtask app bundle`): release code
# optimised for speed (opt-level 3), with link-time optimisation in one codegen unit. Speed over
# download size (decided for dc-09v, 2026-10-25); the sizes and open times are in the commit that
# set it.
[profile.web]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
