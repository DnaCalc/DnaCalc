[package]
name = "calc-xll-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Windows XLL loading and C API callbacks through the shared user-function registry."

[package.metadata.dnacalc]
portability = "native-only"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
calc-xll-abi = { path = "../calc-xll-abi" }

[target.'cfg(windows)'.dependencies]
calc-catalogue = { path = "../calc-catalogue" }
calc-value = { path = "../calc-value" }
calc-func = { path = "../calc-func" }
calc-fml = { path = "../calc-fml" }
libffi = "=5.2.0"
sha2 = "=0.10.9"
