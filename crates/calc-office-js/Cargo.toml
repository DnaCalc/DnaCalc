[package]
name = "calc-office-js"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Office.js face 1, host side (dc-17spk.5): the JSON batch wire protocol an Office Add-in page sends with context.sync(), its executor over the object model, and Office Add-in manifest loading (XML and unified JSON)."

[package.metadata.dnacalc]
portability = "portable"

# The executor is generic over calc-object-model's ObjectModel, so it reaches calc-host only through
# the application that owns one; the manifest loader and wire types need nothing else.
[dependencies]
calc-fml = { path = "../calc-fml" }
calc-object-model = { path = "../calc-object-model" }
calc-value = { path = "../calc-value" }
dna-calc-protocol = { path = "../../apps/dna-calc-protocol" }
quick-xml = "=0.37.5"
serde_json = "=1.0.154"

[dev-dependencies]
calc-host = { path = "../calc-host" }
calc-func = { path = "../calc-func" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
