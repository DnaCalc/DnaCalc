[package]
name = "calc-formula-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Level-zero formula evaluation, caller fixtures and Explorer session files."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-doc = { path = "../calc-doc" }
calc-fml = { path = "../calc-fml" }
calc-formula-kernel = { path = "../calc-formula-kernel" }
calc-skin = { path = "../calc-skin" }
calc-func = { path = "../calc-func" }
calc-macro-security = { path = "../calc-macro-security" }
calc-vba = { path = "../calc-vba" }
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
