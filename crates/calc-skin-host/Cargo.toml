[package]
name = "calc-skin-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Workbook serving over the DNA Calc skin contract."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-host = { path = "../calc-host" }
calc-doc-model = { path = "../calc-doc-model" }
calc-formula-kernel = { path = "../calc-formula-kernel" }
calc-func = { path = "../calc-func" }
calc-skin = { path = "../calc-skin" }
serde = "=1.0.229"
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.94"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
