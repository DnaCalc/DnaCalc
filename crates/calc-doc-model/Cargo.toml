[package]
name = "calc-doc-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for the CalcDoc model: the engine-neutral authored workbook model and input-view types."

[package.metadata.dnacalc]
portability = "portable"

# calc-value supplies the grid coordinates, sheet IDs, text and worksheet error codes the model
# uses (plan 2.1, MODEL to VALUE). serde_json parses an operation batch; serde's visitor traits
# read it into a tree that keeps duplicate keys, so a duplicate is refused rather than dropped.
# No derive: each capability's codec is generated by this package's own declaration macro.
[dependencies]
calc-syntax = { path = "../calc-syntax" }
calc-value = { path = "../calc-value" }
serde = "=1.0.229"
serde_json = "=1.0.154"

# The unit tests run natively and in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117,
# which runs only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67
# is the release built on it (the pair calc-value and calc-func pin). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
