[package]
name = "calc-doc-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The package for the CalcDoc model: the engine-neutral authored workbook model and input-view types."

[package.metadata.dnacalc]
portability = "portable"

# calc-value supplies the grid coordinates, sheet IDs, text and worksheet error codes the model
# uses (plan 2.1, MODEL to VALUE). serde_json parses an operation batch; serde's visitor traits
# read it into a tree that keeps duplicate keys, so a duplicate is refused rather than dropped.
# No derive: each capability's codec is generated by this package's own declaration macro.
[dependencies]
calc-value = { path = "../calc-value" }
serde = "=1.0.229"
serde_json = "=1.0.154"
