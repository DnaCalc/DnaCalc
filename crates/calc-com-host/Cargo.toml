[package]
name = "calc-com-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Process-local Excel COM projection for the native add-in host."

[package.metadata.dnacalc]
portability = "native-only"

[dependencies]
calc-func = { path = "../calc-func" }
calc-value = { path = "../calc-value" }
calc-object-model = { path = "../calc-object-model" }

[target.'cfg(windows)'.dependencies]
calc-xll-host = { path = "../calc-xll-host" }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage",
    "Win32_System_Com_Marshal",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Registry",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation",
    "Win32_UI_Accessibility",
] }
windows-core = "=0.61.2"

[build-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
