[package]
autotests = false
name = "calc-chart-render"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Authored charts drawn from calc-host's ChartView: as SVG (the worker's pane) and rasterised (Chart.Export, printing) with bundled open fonts."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-host = { path = "../calc-host" }
calc-value = { path = "../calc-value" }
calc-func = { path = "../calc-func" }
jpeg-encoder = { version = "0.7.0", default-features = false }
gif = { version = "0.14.0", default-features = false, features = ["std", "color_quant"] }
resvg = { version = "0.50.0", default-features = false, features = ["text"] }

[dev-dependencies]
calc-fml = { path = "../calc-fml" }
calc-doc = { path = "../calc-doc" }
miniz_oxide = "=0.8.9"
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
