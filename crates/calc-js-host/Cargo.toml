[package]
name = "calc-js-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Office.js custom functions and their worksheet callable adapter"

[package.metadata.dnacalc]
portability = "portable"

[features]
default = ["engine-quickjs"]
engine-quickjs = ["dep:rquickjs"]
engine-boa = []
engine-v8 = []
engine-browser = []

[dependencies]
calc-value = { path = "../calc-value" }
calc-func = { path = "../calc-func" }
calc-fml = { path = "../calc-fml" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rquickjs = { version = "=0.12.0", optional = true }
