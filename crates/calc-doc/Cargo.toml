[package]
name = "calc-doc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for the CalcDoc codec: reading, writing and preserving .xlsx/.xlsm packages (ZIP/XML)."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-catalogue = { path = "../calc-catalogue" }
calc-doc-model = { path = "../calc-doc-model" }
# The formula language's one lexer, which moves a shared formula's text to each of its members.
calc-fml = { path = "../calc-fml" }
# The XML tokenizer under the package's lazy part readers. It expands no entity a document
# declares: the reader refuses any document type declaration before its first element, so only
# the five predefined entities and character references are ever replaced. MIT; its one
# dependency, memchr, was already in Cargo.lock.
quick-xml = "=0.37.5"
# The DEFLATE decoder under deflated part payloads, used only through its output-limited
# decompression, so a payload never expands past the size its entry declares. MIT OR Zlib OR
# Apache-2.0; its one non-optional dependency, adler2, is 0BSD OR MIT OR Apache-2.0. Pure Rust,
# so it builds for wasm32-unknown-unknown.
miniz_oxide = "=0.8.9"

# The acceptance cases read the committed wire fixtures and the encoder's output with serde_json.
# serde_json is also the codec's JSON tokenizer, so that reading is not independent of the codec;
# the comparison that is independent of it is the literal-value comparison, which compares the
# fixtures' bytes with text written in the test without parsing them.
[dev-dependencies]
serde_json = "=1.0.154"
# dc-ndi's d1_file_form test checks calc-func's file-prefix metadata against the prefixes the save
# writes, so the two agree for every catalogued function.
calc-func = { path = "../calc-func" }
# The project part calc-doc hands over is read by CalcVBA through the glue crate (theory 5a): the
# VBA tests check what is inside the part on that route.
calc-vba = { path = "../calc-vba" }

# The acceptance cases run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, which runs
# only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67 is the
# release built on that wasm-bindgen (the pair the CI browser fixture pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
