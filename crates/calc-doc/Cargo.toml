[package]
name = "calc-doc"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The package for the CalcDoc codec: reading, writing and preserving .xlsx/.xlsm packages (ZIP/XML)."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-doc-model = { path = "../calc-doc-model" }

# The acceptance cases read the committed wire fixtures and the encoder's output with serde_json.
# serde_json is also the codec's JSON tokenizer, so that reading is not independent of the codec;
# the comparison that is independent of it is the literal-value comparison, which compares the
# fixtures' bytes with text written in the test without parsing them.
[dev-dependencies]
serde_json = "=1.0.154"

# The acceptance cases run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, which runs
# only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67 is the
# release built on that wasm-bindgen (the pair the CI browser fixture pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
