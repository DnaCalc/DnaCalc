[package]
name = "calc-func"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for CalcFunc: the worksheet function catalogue and semantic kernels."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-value = { path = "../calc-value" }
libm = "0.2"

# The cfunc-m1.2 acceptance cases read the Excel capture of their oracle workbook through the one
# verdict library's CaptureRecord and MissingCapture. Test-only: calc-verdict never depends on
# calc-func, so the code under test is not part of its own judge.
[dev-dependencies]
calc-verdict = { path = "../../tools/calc-verdict" }

# The acceptance cases run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, which runs
# only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67 is the
# release built on that wasm-bindgen (the pair the CI browser fixture pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
