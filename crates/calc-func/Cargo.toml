[package]
name = "calc-func"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for CalcFunc: the worksheet function catalogue and semantic kernels."

[package.metadata.dnacalc]
portability = "portable"

[features]
# Runs the software x87 (dc-8dg) on x86_64 too, where the entry points otherwise run the x87
# instructions: the wasm32 route's x87 chains, measured natively (catalogue oracle, corpus).
soft-x87 = []

[dependencies]
calc-value = { path = "../calc-value" }
libm = "0.2"
# FILTERXML parses its XML and evaluates its XPath 1.0 with these (pure Rust, MIT and
# MIT/Apache-2.0; OxFunc's web_text_xml_family.rs used them), dc-uar.
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"

# The cfunc-m1.2 acceptance cases read the Excel capture of their oracle workbook through the one
# verdict library's CaptureRecord and MissingCapture. Test-only: calc-verdict never depends on
# calc-func, so the code under test is not part of its own judge.
[dev-dependencies]
calc-verdict = { path = "../../tools/calc-verdict" }
# The dc-xrxb case reads the package Excel saved, whose parts Excel deflates, with the DEFLATE
# decoder calc-doc already uses (pure Rust, so it builds for wasm32-unknown-unknown). Test-only.
miniz_oxide = "=0.8.9"

# The acceptance cases run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, which runs
# only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67 is the
# release built on that wasm-bindgen (the pair the CI browser fixture pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
