[package]
name = "calc-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for CalcHost: the authoritative authored workbook state, transactions, commands and the skin contract."

[package.metadata.dnacalc]
portability = "portable"

# calc-doc opens, loads and edits the package (plan 2.1: HOST to DOC); calc-doc-model supplies the
# authored revision, the operations and the file caches (HOST to MODEL); calc-engine holds the one
# graph and calculates (HOST to ENG); calc-fml supplies the cell runs a read observer passed to
# step is shown (HOST to FML).
[dependencies]
calc-value = { path = "../calc-value" }
# Share the existing Excel colour palette with painters and colour filters.
calc-func = { path = "../calc-func" }
calc-doc = { path = "../calc-doc" }
calc-doc-model = { path = "../calc-doc-model" }
calc-engine = { path = "../calc-engine" }
calc-fml = { path = "../calc-fml" }

# The dc-hqcv acceptance case builds the one verdict library's calculation-context fingerprint
# from the context the host reports. Test-only: calc-verdict depends on no CalcHost package
# (tools/xtask/architecture.json), so the code under test is not part of its own judge.
[dev-dependencies]
calc-vba = { path = "../calc-vba" }
calc-verdict = { path = "../../tools/calc-verdict" }
# Read the retained P14 raw observations without rewriting their expected values.
serde_json = "=1.0.154"
# Reuse CalcDoc's independent ZIP fixture reader for the actual Host XLSB save test.
miniz_oxide = "=0.8.9"

# The acceptance cases run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, which runs
# only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67 is the
# release built on that wasm-bindgen (the pair the CI browser fixture pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
