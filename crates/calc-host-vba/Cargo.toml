[package]
autotests = false
name = "calc-host-vba"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Shared workbook VBA project and automatic event composition"

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-func = { path = "../calc-func" }
calc-host = { path = "../calc-host" }
calc-object-model = { path = "../calc-object-model" }
calc-vba = { path = "../calc-vba" }
calc-macro-security = { path = "../calc-macro-security" }
calc-value = { path = "../calc-value" }

[dev-dependencies]
calc-doc = { path = "../calc-doc" }
cfb = "=0.10.0"
miniz_oxide = "=0.8.9"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[[test]]
name = "calc-host-vba-integration"
path = "tests/integration.rs"
