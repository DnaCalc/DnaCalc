[package]
name = "calc-value"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The package for CalcFunc's lowest layer: the value types and service contracts that CalcFunc and the CalcDoc model are to share."

[package.metadata.dnacalc]
portability = "portable"

# No [features] table, no optional dependency and no build key: the value model has one shape on
# every target, with std::sync::Arc as its only shared pointer (calc-func's acceptance tests read
# this file and every source file and fail if any appears).

# The unit tests also run in Chrome and Firefox under
# wasm-bindgen-test-runner 0.2.117, which runs only test binaries built with wasm-bindgen 0.2.117
# exactly; wasm-bindgen-test 0.3.67 is the release built on it (the pair calc-func and the CI
# browser fixture pin). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
