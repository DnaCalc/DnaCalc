[package]
name = "calc-vba"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Portable VBA value-function adapter for CalcFunc hosts"

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-func = { path = "../calc-func" }
# Reviewed embedding contract UDF_EMBEDDING_V1. Native selects JIT at admission.
oxvba-embed = { git = "https://github.com/DnaCalc/OxVba.git", rev = "c7ce134918f21038ec1f5f586ebfcac2d1851588", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxvba-embed = { git = "https://github.com/DnaCalc/OxVba.git", rev = "c7ce134918f21038ec1f5f586ebfcac2d1851588", default-features = false, features = ["jit"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
