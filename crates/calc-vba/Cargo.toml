[package]
name = "calc-vba"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Portable VBA value-function adapter for CalcFunc hosts"

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
scoped-tls-hkt = "0.1.5"
thiserror = "2"
oxvba-oxir = { package = "calcvba-oxir", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-eval = { package = "calcvba-eval", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-bundle = { package = "calcvba-bundle", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-symbol = { package = "calcvba-symbol", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-syntax = { package = "calcvba-syntax", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-hal = { package = "calcvba-hal", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-com = { package = "calcvba-com", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-runtime = { package = "calcvba-runtime", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
oxvba-office = { package = "calcvba-office", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307", default-features = false }
calcvba-host-api = { git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
calcvba-lib = { git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307" }
calc-fml = { path = "../calc-fml" }
calc-func = { path = "../calc-func" }
# Reviewed embedding contract UDF_EMBEDDING_V1. Native selects JIT at admission.
oxvba-embed = { package = "calcvba-host", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
oxvba-embed = { package = "calcvba-host", git = "https://github.com/DnaCalc/CalcVBA.git", rev = "2194036276ac3ec1084e8ee697d5f2aa965e3307", default-features = false, features = ["jit"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
