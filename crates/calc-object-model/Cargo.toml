[package]
name = "calc-object-model"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Excel's object model described once: the interface descriptor, Automation values, object identities and the member dispatch that every projection (COM, VBA, JavaScript) calls."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-value = { path = "../calc-value" }
calc-func = { path = "../calc-func" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
