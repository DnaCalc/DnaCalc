[package]
name = "dna-calc-preview-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The browser carrier for level-one workbook serving."

[package.metadata.dnacalc]
portability = "portable"

[target.'cfg(target_arch = "wasm32")'.dependencies]
calc-host = { path = "../../crates/calc-host" }
calc-skin = { path = "../../crates/calc-skin" }
calc-skin-host = { path = "../../crates/calc-skin-host" }
wasm-bindgen = "=0.2.117"
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = ["DedicatedWorkerGlobalScope", "WorkerGlobalScope", "WorkerNavigator", "MessageEvent", "Performance"] }
serde_json = "=1.0.154"
