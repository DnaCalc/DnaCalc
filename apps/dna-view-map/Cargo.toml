[package]
name = "dna-view-map"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The workbook's bounded block-and-wire schematic."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-skin = { path = "../../crates/calc-skin" }
dna-grid = { path = "../dna-grid" }
dna-kit = { path = "../dna-kit" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.117"
web-sys = { version = "=0.3.94", features = ["CanvasRenderingContext2d", "HtmlCanvasElement"] }
