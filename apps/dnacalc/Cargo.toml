[package]
name = "dnacalc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The dnacalc command: headless workbook commands and a local browser page over the native worker, on Linux and Windows."

[package.metadata.dnacalc]
portability = "native-only"

# calc-host is the session (open, edit, recalculate, project, save); calc-host-vba and
# calc-macro-security run the file's VBA project under the macro levels; calc-verdict supplies the
# one value comparison (`compare`) the corpus oracle judges with.
[dependencies]
calc-host = { path = "../../crates/calc-host" }
calc-host-vba = { path = "../../crates/calc-host-vba" }
calc-macro-security = { path = "../../crates/calc-macro-security" }
calc-verdict = { path = "../../tools/calc-verdict" }
serde_json = "=1.0.154"
calc-platform-desktop = { path = "../../platform/calc-platform-desktop" }
dna-calc-worker = { path = "../dna-calc-worker" }
dna-calc-protocol = { path = "../dna-calc-protocol" }
base64 = "=0.22.1"
getrandom = "=0.4.3"
httparse = "=1.10.1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

[[bin]]
name = "dnacalc"
path = "src/main.rs"
