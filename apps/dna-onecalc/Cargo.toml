[package]
name = "dna-onecalc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for the DNA OneCalc application core: formulas without a calculation engine."

[package.metadata.dnacalc]
portability = "portable"

# The controller compiles and evaluates through calc-fml, whose operators and functions are
# calc-func's; the formula field, value and result display, theme and browser start are
# dna-formula-ui's, which DNA Calc shares. Neither calc-engine, calc-doc nor calc-host is in the
# closure, on any target or feature (plan sections 1.3 and 8.7; the onecalc-m1.1 dependency case
# reads cargo metadata to check calc-engine and calc-host).
#
# The browser surface is Leptos in client-side rendering mode (plan section 1.2). Leptos 0.8.19
# resolves against the workspace's wasm-bindgen 0.2.117, which the browser test runner requires
# exactly; web-sys 0.3.94 is the release built on that wasm-bindgen. Both are pinned exactly so a
# lockfile update cannot move them off it. The surface compiles on every target (web-sys builds
# natively) and runs only in a browser.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
calc-vba = { path = "../../crates/calc-vba" }
calc-fml = { path = "../../crates/calc-fml" }
calc-func = { path = "../../crates/calc-func" }
dna-formula-ui = { path = "../dna-formula-ui" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
# The browser entry's start function (src/bin/dna-onecalc-web.rs). 0.2.117 exactly: the release
# Leptos and web-sys resolve against, which the bundle's wasm-bindgen CLI must match.
wasm-bindgen = "=0.2.117"
# The browser's clock for NOW and TODAY (src/surface.rs). 0.3.94 exactly, the release built on
# that wasm-bindgen.
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = ["HtmlElement", "HtmlTextAreaElement", "KeyboardEvent", "console", "Document", "Element", "Storage", "Window"] }

# The dependency case reads cargo metadata's JSON. Test-only, native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
serde_json = "=1.0.154"

# The acceptance cases run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, which
# runs only test binaries built with wasm-bindgen 0.2.117 exactly; wasm-bindgen-test 0.3.67 is the
# release built on that wasm-bindgen (the pair the CI browser fixture pins). The browser part of the
# reference case drives the mounted surface through DOM events and waits for its updates, which
# needs js-sys, web-sys and wasm-bindgen-futures at the releases built on the same wasm-bindgen.
# Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-test = "=0.3.67"
wasm-bindgen-futures = "=0.4.67"
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = [
    "Document",
    "Element",
    "Event",
    "EventInit",
    "EventTarget",
    "HtmlButtonElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Node",
    "NodeList",
    "Window",
] }
