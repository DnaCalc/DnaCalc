[package]
name = "dna-view-inspector"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Workbook audit instruments and the Inspector bench."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-skin = { path = "../../crates/calc-skin" }
dna-kit = { path = "../dna-kit" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
serde_json = "=1.0.154"
uuid = { version = "=1.28.0", features = ["v4", "js"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.67"
web-sys = { version = "=0.3.94", features = ["Clipboard", "Document", "Element", "HtmlElement", "Navigator", "Node", "Window"] }
