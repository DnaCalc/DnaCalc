[package]
name = "dna-calc-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "DNA Calc on the Windows desktop: the page in WebView2 over the native workbook worker (--app), and the CalcHost harness for native add-ins (--engine)."

[package.metadata.dnacalc]
portability = "native-only"

[dependencies]
calc-func = { path = "../../crates/calc-func" }

[target.'cfg(windows)'.dependencies]
calc-addin-host = { path = "../../crates/calc-addin-host" }
calc-platform-desktop = { path = "../../platform/calc-platform-desktop" }
calc-xll-host = { path = "../../crates/calc-xll-host" }
calc-xll-abi = { path = "../../crates/calc-xll-abi" }
calc-value = { path = "../../crates/calc-value" }
calc-host = { path = "../../crates/calc-host" }
serde_json = "=1.0.154"
# The app mode hosts the page in WebView2 over the native workbook worker (M2 of the grid design).
dna-calc-worker = { path = "../dna-calc-worker" }
dna-calc-protocol = { path = "../dna-calc-protocol" }

[target.'cfg(windows)'.dev-dependencies]
calc-xll-fixture = { path = "../../crates/calc-xll-fixture" }
calc-xll-shim = { path = "../../platform/calc-xll-shim" }
