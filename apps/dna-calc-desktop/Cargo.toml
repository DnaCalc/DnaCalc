[package]
name = "dna-calc-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Minimal Windows STA shell for the DNA Calc XLL host."

[package.metadata.dnacalc]
portability = "native-only"

[target.'cfg(windows)'.dependencies]
calc-xll-host = { path = "../../crates/calc-xll-host" }
calc-com-host = { path = "../../crates/calc-com-host" }
calc-xll-abi = { path = "../../crates/calc-xll-abi" }
calc-value = { path = "../../crates/calc-value" }
dna-onecalc = { path = "../dna-onecalc" }
serde_json = "=1.0.154"

windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(windows)'.dev-dependencies]
calc-xll-fixture = { path = "../../crates/calc-xll-fixture" }
calc-xll-shim = { path = "../../platform/calc-xll-shim" }
