<!doctype html>
<html><head><meta charset="utf-8"><title>DNA Calc WebView2 probe</title></head>
<body><script>
// Measurement 2 of the grid design: what WebView2 on this machine offers a grid painter. It reads
// the runtime's adapters, features and limits, proves a device by a compute and a render readback,
// and reports canvas 2D and WebGL facts. The shell writes the JSON this posts and exits.
(async function () {
  var r = { agent: navigator.userAgent, secureContext: isSecureContext, dpr: devicePixelRatio,
    screen: [screen.width, screen.height], hardwareConcurrency: navigator.hardwareConcurrency,
    deviceMemory: navigator.deviceMemory || null, hasGpu: "gpu" in navigator };
  function plain(obj) { var out = {}; for (var k in obj) { out[k] = obj[k]; } return out; }
  try {
    var c = document.createElement("canvas");
    var gl = c.getContext("webgl2") || c.getContext("webgl");
    if (gl) {
      var e = gl.getExtension("WEBGL_debug_renderer_info");
      r.webgl = { version: gl.getParameter(gl.VERSION), vendor: e ? gl.getParameter(e.UNMASKED_VENDOR_WEBGL) : null,
        renderer: e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : null };
    } else { r.webgl = null; }
  } catch (x) { r.webgl = "error " + x; }
  try {
    var ctx = document.createElement("canvas").getContext("2d", { alpha: false });
    r.canvas2d = ctx.getContextAttributes ? plain(ctx.getContextAttributes()) : "no attributes";
  } catch (x) { r.canvas2d = "error " + x; }
  if (navigator.gpu) {
    r.preferredFormat = navigator.gpu.getPreferredCanvasFormat();
    r.wgslLanguageFeatures = Array.from(navigator.gpu.wgslLanguageFeatures || []);
    r.adapters = {};
    var kinds = [["default", {}], ["high-performance", { powerPreference: "high-performance" }],
      ["low-power", { powerPreference: "low-power" }], ["fallback", { forceFallbackAdapter: true }]];
    for (var i = 0; i < kinds.length; i += 1) {
      try {
        var a = await navigator.gpu.requestAdapter(kinds[i][1]);
        if (!a) { r.adapters[kinds[i][0]] = null; continue; }
        var info = a.info || (a.requestAdapterInfo ? await a.requestAdapterInfo() : {});
        r.adapters[kinds[i][0]] = { info: { vendor: info.vendor, architecture: info.architecture, device: info.device,
          description: info.description, subgroupMinSize: info.subgroupMinSize, subgroupMaxSize: info.subgroupMaxSize,
          isFallbackAdapter: a.isFallbackAdapter }, features: Array.from(a.features).sort(), limits: plain(a.limits) };
      } catch (x) { r.adapters[kinds[i][0]] = "error " + x; }
    }
    try {
      var adapter = await navigator.gpu.requestAdapter();
      var feats = ["timestamp-query", "texture-compression-bc", "shader-f16"].filter(function (f) { return adapter.features.has(f); });
      var device = await adapter.requestDevice({ requiredFeatures: feats });
      r.device = { ok: true, requiredFeatures: feats };
      device.lost.then(function (l) { r.deviceLost = l.reason + ": " + l.message; });
      var module = device.createShaderModule({ code:
        "@group(0) @binding(0) var<storage, read_write> v: array<f32>;" +
        "@compute @workgroup_size(64) fn main(@builtin(global_invocation_id) id: vec3<u32>) { if (id.x < arrayLength(&v)) { v[id.x] = v[id.x] * v[id.x]; } }" });
      var pipeline = device.createComputePipeline({ layout: "auto", compute: { module: module, entryPoint: "main" } });
      var n = 1024, input = new Float32Array(n).map(function (_, k) { return k; });
      var storage = device.createBuffer({ size: n * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(storage, 0, input);
      var back = device.createBuffer({ size: n * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      var group = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: storage } }] });
      var enc = device.createCommandEncoder();
      var pass = enc.beginComputePass(); pass.setPipeline(pipeline); pass.setBindGroup(0, group); pass.dispatchWorkgroups(n / 64); pass.end();
      enc.copyBufferToBuffer(storage, 0, back, 0, n * 4);
      device.queue.submit([enc.finish()]);
      await back.mapAsync(GPUMapMode.READ);
      var out = new Float32Array(back.getMappedRange().slice(0)); back.unmap();
      r.compute = { ok: out[1023] === 1023 * 1023 && out[7] === 49, sample: [out[7], out[1023]] };
      // Render to an rgba8unorm texture and read a pixel back: the path a grid painter takes.
      var tex = device.createTexture({ size: [64, 64], format: "rgba8unorm", usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
      var shader = device.createShaderModule({ code:
        "@vertex fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> { var p = array<vec2<f32>,3>(vec2(-1.,-1.), vec2(3.,-1.), vec2(-1.,3.)); return vec4(p[i], 0., 1.); }" +
        "@fragment fn fs() -> @location(0) vec4<f32> { return vec4(1., 0.5, 0.25, 1.); }" });
      var rp = device.createRenderPipeline({ layout: "auto", vertex: { module: shader, entryPoint: "vs" },
        fragment: { module: shader, entryPoint: "fs", targets: [{ format: "rgba8unorm" }] } });
      var rb = device.createBuffer({ size: 256 * 64, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
      var t0 = performance.now();
      var enc2 = device.createCommandEncoder();
      var rpass = enc2.beginRenderPass({ colorAttachments: [{ view: tex.createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
      rpass.setPipeline(rp); rpass.draw(3); rpass.end();
      enc2.copyTextureToBuffer({ texture: tex }, { buffer: rb, bytesPerRow: 256 }, [64, 64]);
      device.queue.submit([enc2.finish()]);
      await rb.mapAsync(GPUMapMode.READ);
      var px = new Uint8Array(rb.getMappedRange().slice(0, 4)); rb.unmap();
      r.render = { ok: px[0] === 255 && px[1] >= 127 && px[1] <= 128 && px[2] >= 63 && px[2] <= 64, pixel: Array.from(px), firstFrameMs: performance.now() - t0 };
      // A canvas context with the preferred format, as a page painter would configure.
      var canvas = document.createElement("canvas"); canvas.width = 256; canvas.height = 256;
      var gctx = canvas.getContext("webgpu");
      gctx.configure({ device: device, format: navigator.gpu.getPreferredCanvasFormat(), alphaMode: "opaque" });
      r.canvasContext = { ok: !!gctx.getCurrentTexture() };
      // Throughput: 200 full-viewport render passes submitted, then the queue drained.
      var t1 = performance.now();
      for (var f = 0; f < 200; f += 1) {
        var e3 = device.createCommandEncoder();
        var p3 = e3.beginRenderPass({ colorAttachments: [{ view: tex.createView(), loadOp: "clear", storeOp: "store", clearValue: [0, 0, 0, 1] }] });
        p3.setPipeline(rp); p3.draw(3); p3.end();
        device.queue.submit([e3.finish()]);
      }
      await device.queue.onSubmittedWorkDone();
      r.submit200Ms = performance.now() - t1;
    } catch (x) { r.device = "error " + x + (x && x.stack ? " " + x.stack : ""); }
  }
  window.chrome.webview.postMessage("probe:" + JSON.stringify(r, null, 1));
})().catch(function (x) { window.chrome.webview.postMessage("probe:" + JSON.stringify({ error: String(x) })); });
</script></body></html>
