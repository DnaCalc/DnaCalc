[package]
name = "dna-onecalc-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "DNA OneCalc on the Windows desktop: the formula session over the loaded add-ins, no calculation engine; OneCalc's page in WebView2 over the native session (--app), and a command-line harness for the add-in comparisons."

[package.metadata.dnacalc]
portability = "native-only"

# OneCalc's dependency ceiling applies to this executable: no calc-host and no calc-engine in its
# closure (`cargo xtask sweep` checks it); calc-doc is allowed (the session file, through dna-onecalc).
# calc-verdict supplies the SHA-256 a saved session lists for each loaded add-in. Add-ins come through calc-addin-host, the window chain
# from calc-platform-desktop; this crate only drives the `Session`.
# The native side of the SessionPort (src/host.rs) holds no window and no COM: it and its tests
# build on every native target, so the session, file and add-in flows run in the Linux checks too.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dna-onecalc = { path = "../dna-onecalc" }
calc-fml = { path = "../../crates/calc-fml" }
calc-vba = { path = "../../crates/calc-vba" }
calc-value = { path = "../../crates/calc-value" }
calc-verdict = { path = "../../tools/calc-verdict" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The add-in surrogate (src/surrogate.rs): the envelope, and the byte connection and supervisor.
calc-surrogate-wire = { path = "../../crates/calc-surrogate-wire" }
calc-platform-desktop = { path = "../../platform/calc-platform-desktop" }

[target.'cfg(windows)'.dependencies]
calc-addin-host = { path = "../../crates/calc-addin-host" }
calc-xll-host = { path = "../../crates/calc-xll-host" }
calc-xll-abi = { path = "../../crates/calc-xll-abi" }

[target.'cfg(windows)'.dev-dependencies]
calc-xll-fixture = { path = "../../crates/calc-xll-fixture" }
calc-xll-shim = { path = "../../platform/calc-xll-shim" }
