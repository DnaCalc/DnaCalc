[package]
name = "dna-onecalc-desktop"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "DNA OneCalc on the Windows desktop: the formula session over the loaded add-ins, no workbook and no calculation engine (today a command-line harness; the page follows)."

[package.metadata.dnacalc]
portability = "native-only"

# OneCalc's dependency ceiling applies to this executable: no calc-host and no calc-engine in its
# closure (`cargo xtask sweep` checks it). Add-ins come through calc-addin-host, the window chain
# from calc-platform-desktop; this crate only drives the `Session`.
[target.'cfg(windows)'.dependencies]
dna-onecalc = { path = "../dna-onecalc" }
calc-addin-host = { path = "../../crates/calc-addin-host" }
calc-platform-desktop = { path = "../../platform/calc-platform-desktop" }
calc-xll-host = { path = "../../crates/calc-xll-host" }
calc-xll-abi = { path = "../../crates/calc-xll-abi" }
calc-value = { path = "../../crates/calc-value" }
serde_json = "=1.0.154"

[target.'cfg(windows)'.dev-dependencies]
calc-xll-fixture = { path = "../../crates/calc-xll-fixture" }
calc-xll-shim = { path = "../../platform/calc-xll-shim" }
