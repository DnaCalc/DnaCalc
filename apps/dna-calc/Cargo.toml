[package]
name = "dna-calc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "DNA Calc browser shell and skins over the neutral model and workbook transport."

[package.metadata.dnacalc]
portability = "portable"

# The shipping page depends only on the model, protocol and shared UI. The separate worker
# owns CalcHost and the document. Architecture rules check the normal dependency closure.
# Integration tests explicitly compose the real headless worker through a dev dependency.
[dependencies]
dna-calc-model = { path = "../dna-calc-model" }
calc-value = { path = "../../crates/calc-value" }
dna-calc-protocol = { path = "../dna-calc-protocol" }
# The one number-format renderer (calc-func's cell_text, which TEXT renders with), for cells' number
# formats (dc-09v).
calc-func = { path = "../../crates/calc-func" }
dna-formula-ui = { path = "../dna-formula-ui" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
# The browser entry's start function (src/bin/dna-calc-web.rs).
wasm-bindgen = "=0.2.117"
# Reading an opened file's bytes (a File's ArrayBuffer promise).
wasm-bindgen-futures = "=0.4.67"
# The clock for timings, the opened file's bytes and the saved package's Blob.
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = [
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "HtmlCanvasElement",
    "ImageData",
    "CanvasPattern",
    "SvgElement",
    "TextMetrics",
    "CssStyleDeclaration",
    "Location",
    "Storage",
    "MutationObserver",
    "MutationObserverInit",
    "MediaQueryList",
    "Blob",
    "BlobPropertyBag",
    "Clipboard",
    "ClipboardItem",
    "ClipboardEvent",
    "DataTransfer",
    "Navigator",
    "HtmlTemplateElement",
    "DocumentFragment",
    "NodeList",
    "Node",
    "Text",
    "console",
    "ErrorEvent",
    "MessageEvent",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Document",
    "DomRect",
    "Range",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlDialogElement",
    "HtmlDetailsElement",
    "BeforeUnloadEvent",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "KeyboardEventInit",
    "MouseEvent",
    "WheelEvent",
    "Performance",
    "ResizeObserver",
    "FontFaceSet",
    "EventTarget",
    "Url",
    "Window",
] }

# The tests run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, with
# wasm-bindgen-test 0.3.67 (the pair the workspace pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Direct controller composition needs the same executor that Leptos mounting installs.
any_spawner = { version = "=0.3.0", features = ["wasm-bindgen"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"

[dev-dependencies]
dna-calc-worker = {path="../dna-calc-worker"}
calc-host = {path="../../crates/calc-host"}
