[package]
name = "dna-calc"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The package for the DNA Calc application core: the Excel, notebook, tree and canvas skins over one CalcHost workbook."

[package.metadata.dnacalc]
portability = "portable"

# DNA Calc reaches the workbook only through calc-host (plan section 1.3: skins never depend on
# engine internals; tools/xtask/architecture.json forbids calc-engine as a direct dependency). The
# formula bar is DNA OneCalc's formula field (dna-onecalc's formula_field module), shared rather
# than copied, with its value display (dna-onecalc's result module); dna-onecalc's own closure
# stays free of calc-engine and calc-host.
#
# The skins are Leptos in client-side rendering mode, at the releases DNA OneCalc pins (see its
# manifest): Leptos 0.8.19 on wasm-bindgen 0.2.117, web-sys and js-sys 0.3.94. The views compile
# on every target and run only in a browser.
[dependencies]
calc-host = { path = "../../crates/calc-host" }
# The one number-format renderer (calc-func's cell_text, which TEXT renders with), for cells' number
# formats (dc-09v).
calc-func = { path = "../../crates/calc-func" }
dna-onecalc = { path = "../dna-onecalc" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
# The browser entry's start function (src/bin/dna-calc-web.rs) and the panic hook (src/web.rs).
wasm-bindgen = "=0.2.117"
# Reading an opened file's bytes (a File's ArrayBuffer promise).
wasm-bindgen-futures = "=0.4.67"
# The clock for timings, the opened file's bytes and the saved package's Blob.
js-sys = "=0.3.94"
# The messages between the page and the calculation worker (src/wire.rs, dc-p96): JSON through
# serde_json, at the releases the workspace already pins.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
web-sys = { version = "=0.3.94", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "MessageEvent",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "Document",
    "DomRect",
    "Element",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Performance",
    "Url",
    "Window",
] }

# The tests run in Chrome and Firefox under wasm-bindgen-test-runner 0.2.117, with
# wasm-bindgen-test 0.3.67 (the pair the workspace pins). Test-only, wasm32-only.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
