[package]
name = "dna-kit"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Strand UI components and view registration."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-skin = { path = "../../crates/calc-skin" }
dna-skin-runtime = { path = "../dna-skin-runtime" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
