[package]
name = "dna-calc-preview"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The side-by-side DNA Calc Classic preview."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-skin = { path = "../../crates/calc-skin" }
dna-kit = { path = "../dna-kit" }
dna-shell = { path = "../dna-shell" }
dna-skin-runtime = { path = "../dna-skin-runtime" }
dna-view-classic = { path = "../dna-view-classic" }
leptos = { version = "=0.8.19", default-features = false, features = ["csr"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.117"
wasm-bindgen-futures = "=0.4.67"
js-sys = "=0.3.94"
web-sys = { version = "=0.3.94", features = ["Blob", "Document", "Element", "ErrorEvent", "File", "FileList", "HtmlElement", "HtmlInputElement", "Location", "MessageEvent", "Window", "Worker", "WorkerOptions", "WorkerType"] }
serde_json = "=1.0.154"
