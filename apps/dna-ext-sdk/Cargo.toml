[package]
name = "dna-ext-sdk"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Signed slot-bound DNA Calc extensions."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
calc-skin = { path = "../../crates/calc-skin" }
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
wasmparser = { version = "=0.240.0", default-features = false, features = ["std"] }
zip = { version = "=4.6.1", default-features = false }

[dev-dependencies]
wat = "=1.240.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.94"
wasm-bindgen = "=0.2.117"
web-sys = { version = "=0.3.94", features = ["DedicatedWorkerGlobalScope", "ErrorEvent", "MessageEvent", "Window", "Worker", "WorkerOptions", "WorkerType"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
