[package]
name = "dna-skin-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The page end of the skin wire: the client, the command table and the keymap, with no UI toolkit."

[package.metadata.dnacalc]
portability = "portable"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
calc-skin = { path = "../../crates/calc-skin" }
dna-strand = { path = "../dna-strand" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.67"
